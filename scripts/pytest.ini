[pytest]
# Pytest configuration for Python scripts

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests — FakeSubprocessRunner, isolated
    integration_mock: Integration tests — real FS, mocked subprocess
    integration_real: Integration tests — real tools via Docker
    e2e: End-to-end tests — Docker Android emulator (Linux + KVM only)
    slow: Slow running tests

# Output
console_output_style = progress

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
