build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 4
  # Composable functions are exempt from size/parameter rules below:
  # declarative UI trees and slot APIs with hoisted state legitimately exceed
  # thresholds designed for imperative code.
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreAnnotated: ['Composable']
  LongMethod:
    active: true
    threshold: 60
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 7
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    # Hilt modules enumerate one @Provides per dependency; splitting them
    # by count alone hurts cohesion. HiltViewModel classes have one handler
    # per UI event — splitting by count degrades cohesion.
    # AndroidEntryPoint activities wire DI fields and lifecycle methods.
    ignoreAnnotated: ['Module', 'HiltViewModel', 'AndroidEntryPoint']
    # Private implementation helpers (e.g., opcode dispatch tables in parsers)
    # are internal detail, not public API surface. Only public/internal functions
    # indicate a class is doing too much.
    ignorePrivate: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true

empty-blocks:
  active: true

exceptions:
  active: true
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: true
    # Android APIs frequently throw base Exception (ContentResolver, PackageManager, etc.).
    # Only flag truly generic Throwable/Error which mask JVM-level failures.
    exceptionNames:
      - Error
      - Throwable

naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    # Composable functions use PascalCase per Compose convention.
    ignoreAnnotated: ['Composable']
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  CastToNullableType:
    active: true
  Deprecation:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  HasPlatformType:
    active: true
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
  ReturnCount:
    active: true
    max: 5
  UnusedPrivateMember:
    active: true
