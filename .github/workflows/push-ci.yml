name: Push-CI

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    uses: ./.github/workflows/python-detect-changes.yml

  kotlin-pipeline:
    uses: ./.github/workflows/kotlin.yml
    secrets: inherit

  python-pipeline:
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    uses: ./.github/workflows/python.yml
