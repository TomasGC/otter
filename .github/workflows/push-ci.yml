name: Push-CI

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-branch:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name format
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Validating branch name: $BRANCH"

          # Expected format: feature/123-description or bugfix/123-description
          # Allows: letters (upper/lower), digits, hyphens, underscores
          if ! echo "$BRANCH" | grep -qE '^(feature|bugfix)/[0-9]+-[a-zA-Z0-9_-]+$'; then
            echo "ERROR: Invalid branch name format"
            echo ""
            echo "Expected format:"
            echo "  - feature/123-description"
            echo "  - bugfix/123-description"
            echo ""
            echo "Examples:"
            echo "SUCCESS: feature/42-add-zip-support"
            echo "SUCCESS: feature/25-Archive_browsing"
            echo "SUCCESS: bugfix/13-fix-extraction-crash"
            echo "ERROR: feature/my-feature (missing issue number)"
            echo "ERROR: feat/42-something (wrong prefix)"
            exit 1
          fi

          echo "SUCCESS: Branch name format valid"

  validate-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message format
        run: |
          echo "Validating commit messages..."

          # Get commits in this push
          COMMITS=$(git log origin/main..HEAD --format="%H %s")

          if [ -z "$COMMITS" ]; then
            echo "No new commits to validate"
            exit 0
          fi

          INVALID_COUNT=0

          while IFS= read -r line; do
            HASH=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo "$line" | cut -d' ' -f2-)

            echo ""
            echo "Checking: $MSG"

            # Expected format: #123: type: description
            # Exception: docs: without issue number is allowed if commit modifies kanban.md
            if echo "$MSG" | grep -qE '^#[0-9]+: (feat|fix|refactor|test|docs|chore|style|perf):'; then
              echo "SUCCESS: Valid format"
            elif echo "$MSG" | grep -qE '^docs:'; then
              FILES=$(git show --name-only --format="" "$HASH")
              if echo "$FILES" | grep -q "kanban.md"; then
                echo "SUCCESS: docs commit modifying kanban.md (issue number not required)"
              else
                echo "  INVALID: docs commit without issue number only allowed when kanban.md is modified"
                INVALID_COUNT=$((INVALID_COUNT + 1))
              fi
            else
              echo "  INVALID format"
              echo "  Expected: #123: type: description"
              echo "  Types: feat, fix, refactor, test, docs, chore, style, perf"
              INVALID_COUNT=$((INVALID_COUNT + 1))
            fi
          done <<< "$COMMITS"

          if [ $INVALID_COUNT -gt 0 ]; then
            echo ""
            echo "ERROR: Found $INVALID_COUNT invalid commit message(s)"
            echo ""
            echo "Valid examples:"
            echo "SUCCESS: #42: feat: add ZIP extraction support"
            echo "SUCCESS: #13: fix: resolve null pointer in extractor"
            echo "SUCCESS: #27: refactor: extract repository pattern"
            exit 1
          fi

          echo ""
          echo "SUCCESS: All commit messages valid"
  lint-checks:
    name: Lint Checks
    uses: ./.github/workflows/reusable-lint-checks.yml
    with:
      retention-days: 3

  unit-domain-service-tests:
    name: Unit Tests / Domain + Service
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      test-type: unit-domain-service
      artifact-name: unit-domain-service
      retention-days: 3

  unit-data-tests:
    name: Unit Tests / Data Layer
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      test-type: unit-data
      artifact-name: unit-data
      retention-days: 3

  unit-ui-tests:
    name: Unit Tests / UI + ViewModel
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      test-type: unit-ui
      artifact-name: unit-ui
      retention-days: 3

  integration-mock-extractor-tests:
    name: Integration Mock / Extractors
    needs: [unit-domain-service-tests, unit-data-tests, unit-ui-tests]
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      test-type: integration-mock-extractor
      artifact-name: integration-mock-extractor
      retention-days: 3

  integration-mock-other-tests:
    name: Integration Mock / Service + ViewModel
    needs: [unit-domain-service-tests, unit-data-tests, unit-ui-tests]
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      test-type: integration-mock-other
      artifact-name: integration-mock-other
      retention-days: 3

  integration-real-tests:
    name: Integration Real Tests
    needs: [integration-mock-extractor-tests, integration-mock-other-tests]
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      test-type: integration-real
      artifact-name: integration-real
      retention-days: 3

  build:
    name: Build APK
    needs: [lint-checks, integration-real-tests]
    uses: ./.github/workflows/reusable-build-apk.yml
    with:
      variant: debug
      retention-days: 3

  ui-tests:
    name: UI Tests
    needs: build
    uses: ./.github/workflows/reusable-instrumented-tests.yml
    with:
      retention-days: 3

  coverage-report:
    name: Coverage Report
    needs: integration-real-tests
    uses: ./.github/workflows/reusable-coverage-merge.yml
    with:
      coverage-threshold: 80
      retention-days: 7
    secrets: inherit
