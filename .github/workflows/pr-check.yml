name: PR Check

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validation:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper diff

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$PR_TITLE" | grep -qE '^#[0-9]+: (feat|fix|refactor|test|docs|chore|style|perf):'; then
            echo "❌ PR title must follow format: #123: type: description"
            echo "Examples:"
            echo "  #1: feat: add ZIP extraction"
            echo "  #2: fix: resolve null pointer in extractor"
            echo "  #3: refactor: extract repository pattern"
            exit 1
          fi
          echo "✅ PR title format valid"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build

      - name: Run build
        run: docker compose run --rm android-build ./gradlew assembleDebug

      - name: Run unit tests
        run: docker compose run --rm android-build ./gradlew testDebugUnitTest

      - name: Run lint
        run: docker compose run --rm android-build ./gradlew lintDebug

      - name: Check for build artifacts
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "❌ Debug APK not found"
            exit 1
          fi
          echo "✅ Build artifacts present"

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const jobStatus = '${{ job.status }}';
            const emoji = jobStatus === 'success' ? '✅' : '❌';
            const message = `${emoji} **PR Check ${jobStatus}**\n\n` +
              `- Build: ${jobStatus === 'success' ? '✅ Passed' : '❌ Failed'}\n` +
              `- Tests: ${jobStatus === 'success' ? '✅ Passed' : '❌ Failed'}\n` +
              `- Lint: ${jobStatus === 'success' ? '✅ Passed' : '❌ Failed'}\n\n` +
              `See [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
