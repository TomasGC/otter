name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    uses: ./.github/workflows/_reusable/build-apk.yml
    with:
      variant: debug
      retention-days: 7

  unit-tests:
    uses: ./.github/workflows/_reusable/unit-tests.yml
    with:
      retention-days: 7

  instrumented-tests:
    uses: ./.github/workflows/_reusable/instrumented-tests.yml
    with:
      api-level: 30
      retention-days: 7

  coverage-merge:
    uses: ./.github/workflows/_reusable/coverage-merge.yml
    needs: [unit-tests, instrumented-tests]
    with:
      coverage-threshold: 75
      retention-days: 7

  pr-validation:
    name: Validate PR Format
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$PR_TITLE" | grep -qE '^#[0-9]+: (feat|fix|refactor|test|docs|chore|style|perf):'; then
            echo "ERROR: PR title must follow format: #123: type: description"
            echo "Examples:"
            echo "  #1: feat: add ZIP extraction"
            echo "  #2: fix: resolve null pointer in extractor"
            echo "  #3: refactor: extract repository pattern"
            exit 1
          fi
          echo "SUCCESS: PR title format valid"

  lint-checks:
    uses: ./.github/workflows/_reusable/lint-checks.yml
    with:
      retention-days: 7

  android-lint-review:
    name: Android Lint Review
    runs-on: ubuntu-latest
    needs: lint-checks
    steps:
      - name: Download lint results
        uses: actions/download-artifact@v4
        with:
          name: lint-results-xml

      - name: Parse lint results
        if: always()
        run: |
          if [ -f lint-results-debug.xml ]; then
            ERROR_COUNT=$(grep -c 'severity="Error"' lint-results-debug.xml || echo 0)
            WARNING_COUNT=$(grep -c 'severity="Warning"' lint-results-debug.xml || echo 0)

            echo "Android Lint Results:"
            echo "  - Errors: $ERROR_COUNT"
            echo "  - Warnings: $WARNING_COUNT"

            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "ERROR: Found $ERROR_COUNT lint errors - check artifact for details"
              exit 1
            else
              echo "SUCCESS: No lint errors found"
            fi
          else
            echo "WARNING: Lint report not found"
            exit 1
          fi

  context-check:
    name: Verify Context Files Updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if contexts are updated
        id: context-check
        run: |
          CODE_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E '^app/src/' || true)
          CONTEXT_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E '^\.claude/(KANBAN|ARCHITECTURE)\.md$' || true)

          if [ -n "$CODE_CHANGES" ] && [ -z "$CONTEXT_CHANGES" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "WARNING: Code changes detected but context files not updated"
            exit 1
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "SUCCESS: Context files updated or no code changes"
          fi

      - name: Comment on PR if contexts need update
        if: failure() && steps.context-check.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Context Files Not Updated

            This PR modifies code but doesn't update context files.

            **Please update**:
            - \`.claude/KANBAN.md\` - Add session notes and task status
            - \`.claude/ARCHITECTURE.md\` - Update if architecture changed

            **Why this matters**: Context files preserve project knowledge between sessions.

            ---
            *Tip: Update manually and amend your commit.*`
            })

  security-checks:
    uses: ./.github/workflows/_reusable/security-checks.yml
    needs: build
    with:
      retention-days: 7

  # Optional: Matrix testing across multiple API levels
  # Uncomment to test on API 26 (min), 30 (stable), 34 (max)
  # instrumented-tests-matrix:
  #   uses: ./.github/workflows/_reusable/instrumented-tests-matrix.yml
  #   with:
  #     retention-days: 7
