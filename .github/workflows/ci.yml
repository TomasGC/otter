name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-feature-ci:
    name: Verify Feature-CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Feature-CI to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Checking Feature-CI status for branch: $BRANCH"

          # Wait up to 30 minutes for Feature-CI to complete
          MAX_WAIT=1800
          WAITED=0
          SLEEP_INTERVAL=30

          while [ $WAITED -lt $MAX_WAIT ]; do
            STATUS=$(gh run list --workflow=feature-ci.yml --branch "$BRANCH" --limit 1 --json status,conclusion --jq '.[0]')
            RUN_STATUS=$(echo "$STATUS" | jq -r '.status')
            CONCLUSION=$(echo "$STATUS" | jq -r '.conclusion')

            echo "Feature-CI status: $RUN_STATUS (conclusion: $CONCLUSION)"

            # If completed, check result
            if [ "$RUN_STATUS" = "completed" ]; then
              if [ "$CONCLUSION" != "success" ]; then
                echo "ERROR: Feature-CI must pass before PR can be merged"
                echo "Feature-CI status: $CONCLUSION"
                echo "Fix Feature-CI failures first, then re-run this workflow"
                exit 1
              fi
              echo "Feature-CI passed successfully"
              exit 0
            fi

            # Still running, wait
            echo "Feature-CI still running, waiting ${SLEEP_INTERVAL}s..."
            sleep $SLEEP_INTERVAL
            WAITED=$((WAITED + SLEEP_INTERVAL))
          done

          echo "ERROR: Feature-CI did not complete within ${MAX_WAIT}s"
          exit 1

          echo "SUCCESS: Feature-CI passed on branch $BRANCH"

  pr-validation:
    name: Validate PR Format
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$PR_TITLE" | grep -qE '^#[0-9]+: (feat|fix|refactor|test|docs|chore|style|perf):'; then
            echo "ERROR: PR title must follow format: #123: type: description"
            echo "Examples:"
            echo "  #1: feat: add ZIP extraction"
            echo "  #2: fix: resolve null pointer in extractor"
            echo "  #3: refactor: extract repository pattern"
            exit 1
          fi
          echo "SUCCESS: PR title format valid"

  security-final-check:
    name: Final Security Validation
    needs: verify-feature-ci
    uses: ./.github/workflows/reusable-security-checks.yml
    with:
      retention-days: 7

  context-check:
    name: Verify Context Files Updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if contexts are updated
        id: context-check
        run: |
          CODE_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E '^app/src/' || true)
          CONTEXT_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E '^\.claude/(KANBAN|ARCHITECTURE)\.md$' || true)

          if [ -n "$CODE_CHANGES" ] && [ -z "$CONTEXT_CHANGES" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "WARNING: Code changes detected but context files not updated"
            exit 1
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "SUCCESS: Context files updated or no code changes"
          fi

      - name: Comment on PR if contexts need update
        if: failure() && steps.context-check.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Context Files Not Updated

            This PR modifies code but doesn't update context files.

            **Please update**:
            - \`.claude/KANBAN.md\` - Add session notes and task status
            - \`.claude/ARCHITECTURE.md\` - Update if architecture changed

            **Why this matters**: Context files preserve project knowledge between sessions.

            ---
            *Tip: Update manually and amend your commit.*`
            })

  security-checks:
    uses: ./.github/workflows/reusable-security-checks.yml
    needs: build
    with:
      retention-days: 7

  # Optional: Matrix testing across multiple API levels
  # Uncomment to test on API 26 (min), 30 (stable), 34 (max)
  # instrumented-tests-matrix:
  #   uses: ./.github/workflows/reusable-instrumented-tests-matrix.yml
  #   with:
  #     retention-days: 7
