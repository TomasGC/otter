name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build

      - name: Run Gradle build
        run: docker compose run --rm android-build ./gradlew assembleDebug

      - name: Run unit tests
        run: docker compose run --rm android-build ./gradlew testDebugUnitTest

      - name: Run lint checks
        run: docker compose run --rm android-build ./gradlew lintDebug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload lint XML for reviewdog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-xml
          path: app/build/reports/lint-results-debug.xml
          retention-days: 1

  instrumented-tests:
    name: Instrumented Tests (RAR5 Extraction)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [29]
        target: [default]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/
          retention-days: 7

  pr-validation:
    name: Validate PR Format
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$PR_TITLE" | grep -qE '^#[0-9]+: (feat|fix|refactor|test|docs|chore|style|perf):'; then
            echo "❌ PR title must follow format: #123: type: description"
            echo "Examples:"
            echo "  #1: feat: add ZIP extraction"
            echo "  #2: fix: resolve null pointer in extractor"
            echo "  #3: refactor: extract repository pattern"
            exit 1
          fi
          echo "✅ PR title format valid"

  ktlint:
    name: Kotlin Style Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run ktlint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/0.50.0/ktlint
          chmod +x ktlint
          ./ktlint --reporter=checkstyle app/src/**/*.kt | \
            reviewdog -f=checkstyle -name="ktlint" -reporter=github-pr-review -level=warning -fail-on-error=false || true

  detekt:
    name: Kotlin Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build

      - name: Run detekt
        run: |
          docker compose run --rm android-build ./gradlew detekt || true

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          retention-days: 7

  android-lint-review:
    name: Android Lint Review
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download lint results
        uses: actions/download-artifact@v4
        with:
          name: lint-results-xml

      - name: Parse lint results
        if: always()
        run: |
          if [ -f lint-results-debug.xml ]; then
            ERROR_COUNT=$(grep -c 'severity="Error"' lint-results-debug.xml || echo 0)
            WARNING_COUNT=$(grep -c 'severity="Warning"' lint-results-debug.xml || echo 0)

            echo "📊 Android Lint Results:"
            echo "  - Errors: $ERROR_COUNT"
            echo "  - Warnings: $WARNING_COUNT"

            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "❌ Found $ERROR_COUNT lint errors - check artifact for details"
              exit 1
            else
              echo "✅ No lint errors found"
            fi
          else
            echo "⚠️ Lint report not found"
            exit 1
          fi

  context-check:
    name: Verify Context Files Updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if contexts are updated
        id: context-check
        run: |
          # Get changed files (excluding context files)
          CODE_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E '^app/src/' || true)

          # Get changed context files
          CONTEXT_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E '^\.claude/(KANBAN|ARCHITECTURE)\.md$' || true)

          # If code changed but no context update, flag it
          if [ -n "$CODE_CHANGES" ] && [ -z "$CONTEXT_CHANGES" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "⚠️ Code changes detected but context files not updated"
            exit 1
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "✅ Context files updated or no code changes"
          fi

      - name: Comment on PR if contexts need update
        if: failure() && steps.context-check.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Context Files Not Updated

            This PR modifies code but doesn't update context files.

            **Please update**:
            - \`.claude/KANBAN.md\` - Add session notes and task status
            - \`.claude/ARCHITECTURE.md\` - Update if architecture changed

            **Why this matters**: Context files preserve project knowledge between sessions.

            ---
            💡 *Tip: Update manually and amend your commit.*`
            })

  test-coverage:
    name: Test Coverage Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image with cache
        run: |
          docker compose build --pull || {
            echo "❌ Docker build failed - retrying without cache"
            docker compose build --no-cache --pull
          }

      - name: Run tests with coverage
        run: docker compose run --rm android-build ./gradlew testDebugUnitTest jacocoTestReport

      - name: Verify coverage threshold (≥ 80%)
        run: |
          docker compose run --rm android-build bash -c '
            # Debug: List all files in jacoco directory
            echo "📁 Jacoco directory contents:"
            ls -lah app/build/reports/jacoco/ || echo "Directory does not exist"
            find app/build/reports/jacoco -type f 2>/dev/null || echo "No files found"

            # Find Jacoco XML report (path may vary)
            REPORT=$(find app/build/reports/jacoco -name "*.xml" -type f 2>/dev/null | head -1)

            if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
              echo "❌ Coverage report not found"
              echo "Expected locations:"
              echo "  - app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
              echo "  - app/build/reports/jacoco/test/jacocoTestReport.xml"
              exit 1
            fi

            echo "📄 Using report: $REPORT"

            # Parse coverage XML (line coverage)
            COVERAGE=$(grep -oP "counter type=\"LINE\".*missed=\"\K[0-9]+" "$REPORT" | head -1)
            COVERED=$(grep -oP "counter type=\"LINE\".*covered=\"\K[0-9]+" "$REPORT" | head -1)

            if [ -z "$COVERAGE" ] || [ -z "$COVERED" ]; then
              echo "⚠️ Could not parse coverage data"
              exit 0
            fi

            TOTAL=$((COVERAGE + COVERED))
            PERCENT=$((COVERED * 100 / TOTAL))

            echo "📊 Test Coverage: $PERCENT% ($COVERED/$TOTAL lines)"

            if [ $PERCENT -lt 80 ]; then
              echo "❌ Coverage $PERCENT% is below threshold (80%)"
              exit 1
            fi

            echo "✅ Coverage meets threshold"
          '

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/
          retention-days: 7

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image with cache
        run: |
          docker compose build --pull || {
            echo "❌ Docker build failed - retrying without cache"
            docker compose build --no-cache --pull
          }

      - name: Run dependency check
        run: docker compose run --rm android-build ./gradlew dependencyCheckAnalyze || true

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: app/build/reports/dependency-check-report.html
          retention-days: 7

      - name: Comment vulnerabilities on PR
        if: always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'app/build/reports/dependency-check-report.html';

            if (!fs.existsSync(reportPath)) {
              console.log('No dependency check report found');
              return;
            }

            const report = fs.readFileSync(reportPath, 'utf8');
            const criticalMatch = report.match(/Critical:\s*(\d+)/);
            const highMatch = report.match(/High:\s*(\d+)/);

            const critical = criticalMatch ? parseInt(criticalMatch[1]) : 0;
            const high = highMatch ? parseInt(highMatch[1]) : 0;

            if (critical > 0 || high > 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ⚠️ Dependency Vulnerabilities Found

                - 🔴 Critical: ${critical}
                - 🟠 High: ${high}

                Please review the [dependency check report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) and update vulnerable dependencies.`
              });
            }

  apk-size-check:
    name: APK Size Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk

      - name: Check APK size
        run: |
          SIZE=$(stat -c%s app-debug.apk)
          SIZE_MB=$((SIZE / 1024 / 1024))

          echo "📦 APK Size: ${SIZE_MB}MB"

          if [ $SIZE -gt 52428800 ]; then # 50MB
            echo "⚠️ APK size (${SIZE_MB}MB) exceeds 50MB threshold"
            exit 1
          fi

          echo "✅ APK size acceptable"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: origin/main
          head: HEAD
          extra_args: --only-verified
