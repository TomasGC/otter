name: PR-CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-push-ci:
    name: Verify Push-CI Passed
    runs-on: ubuntu-latest
    outputs:
      push_ci_passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Check Push-CI status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.head_ref }}"
          REPO="${{ github.repository }}"
          echo "Checking Push-CI status for branch: $BRANCH"

          # Get latest push-ci.yml run for this branch
          RUN=$(gh run list --repo "$REPO" --workflow=push-ci.yml --branch "$BRANCH" --limit 1 --json status,conclusion --jq '.[0]')

          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No Push-CI run found for branch $BRANCH - skipping downstream jobs"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          STATUS=$(echo "$RUN" | jq -r '.status')
          CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')

          echo "Push-CI status: $STATUS (conclusion: $CONCLUSION)"

          if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
            echo "Push-CI passed - proceeding with PR-CI"
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "Push-CI not completed or failed - skipping downstream jobs"
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

  pr-validation:
    name: Validate PR Format
    runs-on: ubuntu-latest
    needs: verify-push-ci
    if: needs.verify-push-ci.outputs.push_ci_passed == 'true'
    steps:
      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$PR_TITLE" | grep -qE '^#[0-9]+: (feat|fix|refactor|test|docs|chore|style|perf):'; then
            echo "ERROR: PR title must follow format: #123: type: description"
            echo "Examples:"
            echo "  #1: feat: add ZIP extraction"
            echo "  #2: fix: resolve null pointer in extractor"
            echo "  #3: refactor: extract repository pattern"
            exit 1
          fi
          echo "SUCCESS: PR title format valid"

  context-check:
    name: Verify Context Files Updated
    runs-on: ubuntu-latest
    needs: verify-push-ci
    if: needs.verify-push-ci.outputs.push_ci_passed == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if contexts are updated
        id: context-check
        run: |
          CODE_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E '^app/src/' || true)
          CONTEXT_CHANGES=$(git diff --name-only origin/main...HEAD | grep -E '^\.claude/(KANBAN|ARCHITECTURE)\.md$' || true)

          if [ -n "$CODE_CHANGES" ] && [ -z "$CONTEXT_CHANGES" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "WARNING: Code changes detected but context files not updated"
            exit 1
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "SUCCESS: Context files updated or no code changes"
          fi

      - name: Comment on PR if contexts need update
        if: failure() && steps.context-check.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Context Files Not Updated

            This PR modifies code but doesn't update context files.

            **Please update**:
            - \`.claude/KANBAN.md\` - Add session notes and task status
            - \`.claude/ARCHITECTURE.md\` - Update if architecture changed

            **Why this matters**: Context files preserve project knowledge between sessions.

            ---
            *Tip: Update manually and amend your commit.*`
            })

  security-checks:
    name: Security Validation
    needs: verify-push-ci
    if: needs.verify-push-ci.outputs.push_ci_passed == 'true'
    uses: ./.github/workflows/reusable-security-checks.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      retention-days: 7

  # Optional: Matrix testing across multiple API levels
  # Uncomment to test on API 26 (min), 30 (stable), 34 (max)
  # instrumented-tests-matrix:
  #   uses: ./.github/workflows/reusable-instrumented-tests-matrix.yml
  #   with:
  #     retention-days: 7
