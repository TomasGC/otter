name: Unit Tests (Reusable)

on:
  workflow_call:
    inputs:
      test-type:
        description: "Test filter type: unit-domain-service | unit-data | unit-ui | integration-mock-extractor | integration-mock-other | integration-real | all"
        type: string
        default: "all"
      artifact-name:
        description: "Name prefix for uploaded artifacts"
        type: string
        default: "unit"
      retention-days:
        description: "Test results retention days"
        type: number
        default: 7

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate test archives (RPA only - pure Python, no Docker/7z required)
        run: python scripts/src/cli/create_test_archives.py --rpa-only

      - name: Run tests
        run: ./gradlew testDebugUnitTest -DtestType=${{ inputs.test-type }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: ${{ inputs.retention-days }}

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-coverage-data
          path: app/build/kover/bin-reports/testDebugUnitTest.ic
          retention-days: ${{ inputs.retention-days }}
