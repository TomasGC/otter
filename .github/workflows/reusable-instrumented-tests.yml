name: Instrumented Tests (Reusable)

on:
  workflow_call:
    inputs:
      retention-days:
        description: "Test results retention days"
        type: number
        default: 7

jobs:
  instrumented-tests:
    name: Instrumented Tests (Gradle Managed Devices)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: false

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests with Gradle Managed Devices
        run: ./gradlew pixel4api30DebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/
          retention-days: ${{ inputs.retention-days }}

      - name: Upload instrumented coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-coverage
          path: app/build/outputs/code_coverage/
          retention-days: ${{ inputs.retention-days }}
