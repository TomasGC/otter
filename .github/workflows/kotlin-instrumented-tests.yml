name: Kotlin / Instrumented Tests

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 7

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  instrumented:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate test archives
        run: |
          PYTHONPATH=scripts/src python scripts/src/cli/generate_archive_template.py
          mkdir -p archives/push
          PYTHONPATH=scripts/src python scripts/src/cli/create_test_archives.py --rpa-only --output-dir archives/push
          python - << 'EOF'
          import zipfile
          from pathlib import Path

          template = Path("archives/template")
          out = Path("archives/push/test_archive.zip")

          if out.exists():
              print(f"ZIP already exists ({out.stat().st_size // 1024 // 1024} MB), skipping")
          else:
              out.parent.mkdir(exist_ok=True)
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=1) as zf:
                  for f in sorted(template.rglob("*")):
                      if f.is_file():
                          zf.write(f, f.relative_to(template))
              print(f"ZIP created: {out.stat().st_size // 1024 // 1024} MB")
          EOF

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install system image
        run: ./gradlew pixel4api30Setup

      - name: Create AVD
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          mkdir -p /home/runner/.android/avd
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n "otter_test_avd" \
            -k "system-images;android-30;default;x86_64" \
            --device "pixel_4" \
            --force
          AVD_DIR="/home/runner/.android/avd/otter_test_avd.avd"
          sed -i '/^disk.dataPartition.size/d' "$AVD_DIR/config.ini"
          echo "disk.dataPartition.size=8G" >> "$AVD_DIR/config.ini"
          rm -f "$AVD_DIR/userdata-qemu.img" "$AVD_DIR/userdata.img"
          echo "AVD created: $($ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd -c)"

      - name: Start emulator and push test archives
        timeout-minutes: 20
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          AVD_NAME="otter_test_avd"
          echo "Starting AVD: $AVD_NAME"
          $ANDROID_HOME/emulator/emulator \
            -avd "$AVD_NAME" \
            -no-snapshot-load \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-window \
            -partition-size 8192 \
            -sdcard 2048M &
          echo "Waiting for emulator boot..."
          timeout 600 adb wait-for-device
          adb shell 'until [[ "$(getprop sys.boot_completed)" == "1" ]]; do sleep 2; done'
          sleep 5
          echo "Emulator ready"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell mkdir -p /storage/emulated/0/otter-test-archives
          for f in archives/push/test_archive.*; do
            echo "Pushing $f..."
            adb push "$f" /storage/emulated/0/otter-test-archives/
          done
          echo "Archives on device: $(adb shell ls /storage/emulated/0/otter-test-archives/)"

      - name: Run instrumented tests
        run: ./gradlew connectedDebugAndroidTest

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/
          retention-days: ${{ inputs.retention-days }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-coverage
          path: app/build/outputs/code_coverage/
          retention-days: ${{ inputs.retention-days }}
