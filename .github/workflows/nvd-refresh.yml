name: NVD Database Refresh

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly, Monday 3 AM UTC
  workflow_dispatch:

jobs:
  nvd-refresh:
    uses: TomasGC/condor/.github/workflows/kotlin-nvd-refresh.yml@main
    with:
      java-version: '21'
    secrets:
      nvd-api-key: ${{ secrets.NVD_API_KEY }}
