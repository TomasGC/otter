# OSV Scanner configuration
# Build tool dependencies pulled in by Android Gradle Plugin (AGP) are excluded
# because they are never shipped in the APK and only affect the build environment.

[[PackageOverrides]]
name = "com.google.protobuf:protobuf-java"
ecosystem = "Maven"
ignore = true
reason = "AGP build tool dependency, not shipped in APK"

[[PackageOverrides]]
name = "commons-io:commons-io"
ecosystem = "Maven"
ignore = true
reason = "AGP build tool dependency, not shipped in APK"

[[PackageOverrides]]
name = "io.netty:netty-codec"
ecosystem = "Maven"
ignore = true
reason = "AGP internal networking stack (build daemon), not shipped in APK"

[[PackageOverrides]]
name = "io.netty:netty-codec-http"
ecosystem = "Maven"
ignore = true
reason = "AGP internal networking stack (build daemon), not shipped in APK"

